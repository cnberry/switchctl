[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "switchctl"
version = "0.2.0"
description = "Tiny local-switch CLI for guarded home control"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Chris Berry"}]
keywords = ["switch", "tuya", "local-control", "home-automation", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]
dependencies = [
  "tinytuya>=1.16,<2",
]

[project.optional-dependencies]
dev = ["detect-secrets>=1.5,<2", "pytest>=8,<9", "ruff>=0.9,<1"]

[project.urls]
Homepage = "https://github.com/cnberry/switchctl"
Issues = "https://github.com/cnberry/switchctl/issues"

[project.scripts]
switchctl = "switchctl.cli:main"

[tool.setuptools]
packages = ["switchctl", "switchctl.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
